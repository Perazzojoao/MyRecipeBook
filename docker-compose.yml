services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: myrecipebook
      MYSQL_USER: ${MYSQL_USER:-myrecipebook}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-myrecipebook}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
