name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  tests:
    name: Unit and integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: "10.0.x"

      # Testcontainers uses the runner's Docker daemon for MySQL and Ryuk.
      - name: Verify Docker for Testcontainers
        run: docker info

      - name: Restore
        run: dotnet restore MyRecipeBook.slnx

      - name: Build
        run: dotnet build MyRecipeBook.slnx --configuration Release --no-restore

      - name: Run all tests
        run: >-
          dotnet test MyRecipeBook.slnx
          --configuration Release
          --no-build
          --no-restore
          --logger trx
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: warn
          retention-days: 2
